name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: 基础测试 Python ${{ matrix.python-version }}（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest 现在是 Ubuntu 26.04，而 setup-python 的版本清单里
        # Python 3.9 只提供到 24.04（在 26.04 上会报 "was not found for Ubuntu 26.04"），
        # 所以 3.9 单独钉在仍然提供它的 ubuntu-24.04 上。
        include:
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.12"
            os: ubuntu-latest
          - python-version: "3.13"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,plot]"

      # 这个任务故意不装 torch：nn 的用例会跳过，但"没有 torch 也能导入"这一点必须成立。
      - name: 跑测试
        run: pytest -v

  tests-with-torch:
    name: 装了 torch 的完整测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 CPU 版 torch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: 安装本包与测试依赖
        run: python -m pip install -e ".[dev,plot]"

      - name: 跑测试（含 nn 全部用例）
        run: pytest -v
