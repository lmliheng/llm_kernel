name: Upload Python Package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build release distributions
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Smoke test the built wheel
        run: |
          python -m pip install dist/*.whl
          cd /tmp
          python -c "from llm_kernel.math import normal; assert abs(normal(0.0, 0, 1) - 0.3989422804014327) < 1e-12"
          python -c "from llm_kernel.performance import Timer; t = Timer(); t.start(); t.stop(); assert t.sum() >= 0"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build

    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/llm_kernel

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # 仓库配了 PYPI_API_TOKEN secret 就用它上传；没有配置时这里为空，
          # action 会自动改走 OIDC 可信发布。
          password: ${{ secrets.PYPI_API_TOKEN }}
